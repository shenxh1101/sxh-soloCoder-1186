<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录 - Favicon生成器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📋 历史记录</h1>
            <p class="subtitle">查看最近生成的图标任务</p>
            <div class="header-actions">
                <a href="{{ url_for('main.index') }}" class="btn-secondary">← 返回上传</a>
            </div>
        </header>

        <div class="history-container">
            {% if records %}
            <div class="history-list">
                {% for record in records %}
                <div class="history-item" data-id="{{ record.id }}">
                    <div class="history-thumbnail">🖼️</div>
                    <div class="history-info">
                        <div class="history-name">{{ record.original_name }}</div>
                        <div class="history-meta">
                            <span>{{ record.created_at }}</span>
                            {% if record.cached %}
                            <span class="history-badge cached">来自缓存</span>
                            {% else %}
                            <span class="history-badge new">新生成</span>
                            {% endif %}
                            <span>{{ record.file_count }} 个文件</span>
                        </div>
                    </div>
                    <div class="history-actions">
                        <a href="{{ url_for('main.history_preview', record_id=record.id) }}" class="btn-view">👁️ 预览</a>
                        <a href="{{ url_for('main.history_download', record_id=record.id) }}" class="btn-download">📦 下载</a>
                        <button class="btn-delete" onclick="deleteRecord('{{ record.id }}', this)">🗑️ 删除</button>
                    </div>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <div class="empty-state">
                <div class="empty-icon">📭</div>
                <h3>暂无历史记录</h3>
                <p>上传图片生成图标后，记录会显示在这里</p>
                <a href="{{ url_for('main.index') }}" class="btn-primary" style="display:inline-block;margin-top:20px;">
                    立即生成
                </a>
            </div>
            {% endif %}
        </div>
    </div>

    <script>
        function deleteRecord(recordId, btn) {
            if (!confirm('确定要删除这条记录吗？')) {
                return;
            }
            
            fetch('/api/history/delete/' + recordId, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const item = btn.closest('.history-item');
                    item.style.opacity = '0';
                    item.style.transform = 'translateX(50px)';
                    setTimeout(() => {
                        item.remove();
                        if (document.querySelectorAll('.history-item').length === 0) {
                            location.reload();
                        }
                    }, 300);
                }
            })
            .catch(error => {
                alert('删除失败: ' + error.message);
            });
        }
    </script>
</body>
</html>
