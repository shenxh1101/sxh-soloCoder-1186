<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon & 图标批量生成器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🖼️ Favicon & 图标批量生成器</h1>
            <p class="subtitle">上传高清图片，一键生成适配各种平台的图标集</p>
            <div class="header-actions">
                <a href="{{ url_for('main.history') }}" class="btn-secondary">📋 历史记录</a>
            </div>
        </header>

        <div class="main-content">
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" name="files" multiple accept="image/*,.zip">
                    <div class="upload-content">
                        <div class="upload-icon">📁</div>
                        <h3>拖拽图片或点击上传</h3>
                        <p>支持单张图片或包含多张图片的 ZIP 包</p>
                        <p class="hint">推荐尺寸: 1024x1024 或更高分辨率</p>
                        <p class="hint">支持格式: PNG, JPG, GIF, WebP, BMP, ZIP</p>
                    </div>
                </div>
                <div class="file-list" id="fileList"></div>
            </div>

            <div class="options-section">
                <h2>⚙️ 处理选项</h2>
                
                <div class="option-group">
                    <h3>基础设置</h3>
                    <div class="option-item">
                        <label for="cornerRadius">圆角半径</label>
                        <input type="range" id="cornerRadius" name="corner_radius" min="0" max="200" value="0">
                        <span id="cornerRadiusValue">0px</span>
                    </div>
                    <div class="option-item">
                        <label for="backgroundColor">背景颜色</label>
                        <div class="color-input-group">
                            <input type="color" id="backgroundColor" name="background_color" value="#ffffff" disabled>
                            <input type="text" id="backgroundColorText" placeholder="留空为透明" value="" disabled>
                            <label class="checkbox-inline">
                                <input type="checkbox" id="transparentBg" checked>
                                透明背景
                            </label>
                        </div>
                    </div>
                </div>

                <div class="option-group">
                    <h3>阴影效果</h3>
                    <div class="option-item">
                        <label class="checkbox-inline">
                            <input type="checkbox" id="shadow" name="shadow">
                            启用阴影
                        </label>
                    </div>
                    <div id="shadowOptions" style="display: none;">
                        <div class="option-item">
                            <label for="shadowBlur">模糊半径</label>
                            <input type="range" id="shadowBlur" name="shadow_blur" min="1" max="50" value="10">
                            <span id="shadowBlurValue">10px</span>
                        </div>
                        <div class="option-item">
                            <label>阴影偏移</label>
                            <div class="offset-inputs">
                                <div>
                                    <label for="shadowOffsetX">X:</label>
                                    <input type="number" id="shadowOffsetX" name="shadow_offset_x" value="0" min="-100" max="100">
                                    <span>px</span>
                                </div>
                                <div>
                                    <label for="shadowOffsetY">Y:</label>
                                    <input type="number" id="shadowOffsetY" name="shadow_offset_y" value="4" min="-100" max="100">
                                    <span>px</span>
                                </div>
                            </div>
                        </div>
                        <div class="option-item">
                            <label for="shadowColor">阴影颜色</label>
                            <input type="color" id="shadowColor" value="#000000">
                            <input type="text" id="shadowOpacity" value="0.3" min="0" max="1" step="0.1" style="width: 60px;">
                            <span>透明度</span>
                        </div>
                    </div>
                </div>

                <div class="option-group">
                    <h3>应用信息</h3>
                    <div class="option-item">
                        <label for="appName">应用名称</label>
                        <input type="text" id="appName" name="app_name" value="My App">
                    </div>
                    <div class="option-item">
                        <label for="appShortName">短名称</label>
                        <input type="text" id="appShortName" name="app_short_name" value="App">
                    </div>
                    <div class="option-item">
                        <label for="themeColor">主题颜色</label>
                        <input type="color" id="themeColor" name="theme_color" value="#ffffff">
                    </div>
                </div>

                <div class="option-group">
                    <h3>高级选项</h3>
                    <div class="option-item">
                        <label for="customSizes">自定义尺寸</label>
                        <input type="text" id="customSizes" name="custom_sizes" placeholder="例如: 64, 128x256, 256">
                        <p class="hint">多个尺寸用逗号分隔，如: 64, 128x256, 512</p>
                    </div>
                    
                    <div class="option-item">
                        <label class="checkbox-inline">
                            <input type="checkbox" id="enableCrop" checked>
                            上传后进入裁剪编辑
                        </label>
                    </div>
                </div>

                <div class="option-group">
                    <div class="option-group-header">
                        <h3>📝 输出文件名</h3>
                        <button class="toggle-btn" id="toggleFilenames">展开</button>
                    </div>
                    <div class="filename-options" id="filenameOptions" style="display: none;">
                        <div class="filename-item">
                            <label>Favicon</label>
                            <input type="text" name="filename_favicon" value="favicon.ico" placeholder="favicon.ico">
                        </div>
                        <div class="filename-item">
                            <label>Apple Touch (180px)</label>
                            <input type="text" name="filename_apple-touch-icon-180x180" value="apple-touch-icon.png" placeholder="apple-touch-icon.png">
                        </div>
                        <div class="filename-item">
                            <label>Android Chrome (192px)</label>
                            <input type="text" name="filename_android-chrome-192x192" value="android-chrome-192x192.png" placeholder="android-chrome-192x192.png">
                        </div>
                        <div class="filename-item">
                            <label>Android Chrome (512px)</label>
                            <input type="text" name="filename_android-chrome-512x512" value="android-chrome-512x512.png" placeholder="android-chrome-512x512.png">
                        </div>
                        <div class="filename-item">
                            <label>Windows 磁贴 (150px)</label>
                            <input type="text" name="filename_mstile-150x150" value="mstile-150x150.png" placeholder="mstile-150x150.png">
                        </div>
                        <p class="hint">留空则使用默认文件名。自定义尺寸的文件名可在生成后预览页修改。</p>
                    </div>
                </div>

                <button id="generateBtn" class="generate-btn" disabled>
                    <span class="btn-icon">✨</span>
                    <span class="btn-text">上传并进入下一步</span>
                </button>
            </div>
        </div>

        <div class="progress-overlay" id="progressOverlay" style="display: none;">
            <div class="progress-content">
                <div class="spinner"></div>
                <h3 id="progressTitle">正在上传...</h3>
                <p id="progressText">请稍候</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
