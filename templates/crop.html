<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片裁剪 - Favicon生成器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/crop.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>✂️ 图片裁剪</h1>
            <p class="subtitle">调整图片位置和大小，选择最佳构图</p>
            <div class="header-actions">
                <a href="{{ url_for('main.index') }}" class="btn-secondary">← 返回上传</a>
            </div>
        </header>

        <div class="crop-container">
            <div class="crop-left">
                <div class="crop-info">
                    <span>原图: <b id="currentImageName">{{ image_name }}</b></span>
                    <span id="currentImageSize">{{ image_width }} × {{ image_height }}</span>
                    {% if image_count > 1 %}
                    <span class="batch-hint">批量模式：共 <b id="imageCountText">{{ image_count }}</b> 张，当前第 <b id="currentImageIndex">1</b> 张</span>
                    {% endif %}
                </div>

                {% if image_count > 1 %}
                <div class="batch-crop-controls">
                    <button class="btn-secondary" id="prevImageBtn" onclick="switchImage(-1)">← 上一张</button>
                    <button class="btn-secondary apply-all-btn" id="applyFirstBtn" onclick="applyFirstToAll()" title="将第1张的裁剪参数（位置、缩放、尺寸）应用到所有图片">
                        🎯 把第1张设置套用到全部
                    </button>
                    <button class="btn-secondary" id="nextImageBtn" onclick="switchImage(1)">下一张 →</button>
                    <span id="imageProgress" style="margin-left:auto;font-size:12px;color:#64748b;">1 / {{ image_count }}</span>
                </div>
                <div class="batch-thumbnails" id="batchThumbnails"></div>
                {% endif %}
                
                <div class="crop-canvas-wrapper">
                    <div class="crop-canvas" id="cropCanvas">
                        <img id="originalImage" src="{{ url_for('main.original_image_api', upload_id=upload_id) }}" alt="原图">
                        <div class="crop-frame" id="cropFrame">
                            <div class="crop-grid">
                                <div class="grid-line v1"></div>
                                <div class="grid-line v2"></div>
                                <div class="grid-line h1"></div>
                                <div class="grid-line h2"></div>
                            </div>
                            <div class="crop-handles">
                                <div class="handle handle-nw" data-handle="nw"></div>
                                <div class="handle handle-n" data-handle="n"></div>
                                <div class="handle handle-ne" data-handle="ne"></div>
                                <div class="handle handle-w" data-handle="w"></div>
                                <div class="handle handle-e" data-handle="e"></div>
                                <div class="handle handle-sw" data-handle="sw"></div>
                                <div class="handle handle-s" data-handle="s"></div>
                                <div class="handle handle-se" data-handle="se"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="crop-controls">
                    <div class="control-row">
                        <label>缩放:</label>
                        <input type="range" id="scaleSlider" min="0.1" max="3" step="0.01" value="1">
                        <span id="scaleValue">100%</span>
                    </div>
                    
                    <div class="control-row">
                        <label>裁剪模式:</label>
                        <div class="mode-buttons">
                            <button class="mode-btn active" data-mode="cover">填充 (Cover)</button>
                            <button class="mode-btn" data-mode="contain">包含 (Contain)</button>
                            <button class="mode-btn" data-mode="fill">拉伸 (Fill)</button>
                        </div>
                    </div>

                    <div class="control-row">
                        <label>裁剪尺寸:</label>
                        <div class="size-inputs">
                            <input type="number" id="cropWidth" value="512" min="16">
                            <span>×</span>
                            <input type="number" id="cropHeight" value="512" min="16">
                            <button class="lock-btn active" id="lockRatio" title="锁定宽高比">🔒</button>
                        </div>
                    </div>

                    <div class="control-row">
                        <label>预设比例:</label>
                        <div class="preset-buttons">
                            <button class="preset-btn" data-ratio="1:1">1:1</button>
                            <button class="preset-btn" data-ratio="4:3">4:3</button>
                            <button class="preset-btn" data-ratio="16:9">16:9</button>
                            <button class="preset-btn" data-ratio="3:4">3:4</button>
                            <button class="preset-btn" data-ratio="9:16">9:16</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="crop-right">
                <h3>📱 预览效果</h3>
                
                <div class="preview-section">
                    <h4>正方形图标 (512×512)</h4>
                    <div class="preview-item large">
                        <img id="previewSquare" src="" alt="预览">
                    </div>
                </div>

                <div class="preview-section">
                    <h4>小图标预览</h4>
                    <div class="preview-row">
                        <div class="preview-item small">
                            <img id="preview16" src="" alt="16px">
                            <span>16px</span>
                        </div>
                        <div class="preview-item small">
                            <img id="preview32" src="" alt="32px">
                            <span>32px</span>
                        </div>
                        <div class="preview-item small">
                            <img id="preview48" src="" alt="48px">
                            <span>48px</span>
                        </div>
                        <div class="preview-item small">
                            <img id="preview128" src="" alt="128px">
                            <span>128px</span>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn-secondary btn-full" id="skipCropBtn">跳过裁剪，直接生成</button>
                    <button class="btn-primary btn-full" id="applyCropBtn">
                        <span class="btn-icon">✅</span>
                        应用并生成图标
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var uploadId = "{{ upload_id }}";
        var imageWidth = {{ image_width }};
        var imageHeight = {{ image_height }};
    </script>
    <script src="{{ url_for('static', filename='js/crop.js') }}"></script>
</body>
</html>
